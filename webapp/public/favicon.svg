<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#1a2a3a"/><stop offset="100%" stop-color="#0a1a2a"/></radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFD700"/><stop offset="50%" stop-color="#FF8C00"/><stop offset="100%" stop-color="#8B4513"/></linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E8E8E8"/><stop offset="50%" stop-color="#A9A9A9"/><stop offset="100%" stop-color="#5a6a7a"/></linearGradient>
    <linearGradient id="diamond" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#B8860B"/><stop offset="45%" stop-color="#FFD700"/><stop offset="55%" stop-color="#E8E8E8"/><stop offset="100%" stop-color="#5a7a9a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Left wing gold -->
  <g opacity="0.95">
    <path d="M 38 140 L 85 98 L 105 125 L 65 165 Z" fill="url(#gold)"/>
    <path d="M 28 180 L 78 135 L 95 162 L 48 205 Z" fill="url(#gold)" opacity="0.95"/>
    <path d="M 22 220 L 72 175 L 88 202 L 38 245 Z" fill="url(#gold)" opacity="0.9"/>
    <path d="M 20 260 L 65 215 L 82 240 L 32 285 Z" fill="url(#gold)" opacity="0.85"/>
    <path d="M 28 300 L 62 260 L 78 283 L 38 320 Z" fill="url(#gold)" opacity="0.8"/>
  </g>
  <!-- Right wing silver -->
  <g opacity="0.95">
    <path d="M 474 140 L 427 98 L 407 125 L 447 165 Z" fill="url(#silver)"/>
    <path d="M 484 180 L 434 135 L 417 162 L 464 205 Z" fill="url(#silver)" opacity="0.95"/>
    <path d="M 490 220 L 440 175 L 424 202 L 474 245 Z" fill="url(#silver)" opacity="0.9"/>
    <path d="M 492 260 L 447 215 L 430 240 L 480 285 Z" fill="url(#silver)" opacity="0.85"/>
    <path d="M 484 300 L 450 260 L 434 283 L 474 320 Z" fill="url(#silver)" opacity="0.8"/>
  </g>
  <!-- Center diamond -->
  <g filter="url(#glow)">
    <path d="M 256 42 L 335 195 L 256 342 L 177 195 Z" fill="none" stroke="url(#diamond)" stroke-width="14" stroke-linejoin="round"/>
    <path d="M 256 62 L 318 195 L 256 318 L 194 195 Z" fill="url(#diamond)" opacity="0.15"/>
    <!-- Inner diamond highlight -->
    <path d="M 256 82 L 298 195 L 256 298 L 214 195 Z" fill="none" stroke="white" stroke-width="1.5" opacity="0.4"/>
  </g>
  <!-- Bright center glint -->
  <ellipse cx="256" cy="195" rx="18" ry="28" fill="white" opacity="0.95" style="filter: blur(2px)"/>
  <ellipse cx="256" cy="195" rx="8" ry="14" fill="white" opacity="1"/>
  <!-- Crossed knives -->
  <g transform="translate(256,385) rotate(-28)">
    <rect x="-78" y="-7" width="156" height="14" rx="6" fill="url(#silver)" stroke="#2a3a4a" stroke-width="1.5"/>
    <path d="M 78 -9 L 102 -3 L 78 9 Z" fill="url(#gold)" stroke="#5a4a00" stroke-width="1"/>
  </g>
  <g transform="translate(256,385) rotate(28)">
    <rect x="-78" y="-7" width="156" height="14" rx="6" fill="url(#silver)" stroke="#2a3a4a" stroke-width="1.5"/>
    <path d="M -78 -9 L -102 -3 L -78 9 Z" fill="url(#gold)" stroke="#5a4a00" stroke-width="1"/>
    <rect x="58" y="-7" width="42" height="14" rx="3" fill="#2a3a4a"/>
  </g>
  <!-- Skull -->
  <g transform="translate(256,378)">
    <ellipse cx="0" cy="0" rx="48" ry="54" fill="#C8C8C8" stroke="#6a7a8a" stroke-width="1.5"/>
    <ellipse cx="0" cy="-4" rx="42" ry="46" fill="#E8E8E8"/>
    <ellipse cx="0" cy="-8" rx="36" ry="38" fill="#F5F5F5"/>
    <!-- Eye sockets -->
    <ellipse cx="-14" cy="-8" rx="13" ry="15" fill="#1a1a1a"/>
    <ellipse cx="14" cy="-8" rx="13" ry="15" fill="#1a1a1a"/>
    <ellipse cx="-14" cy="-6" rx="5" ry="4" fill="white" opacity="0.15"/>
    <ellipse cx="14" cy="-6" rx="5" ry="4" fill="white" opacity="0.15"/>
    <!-- Nose -->
    <path d="M 0 4 L -6 14 L 6 14 Z" fill="#1a1a1a"/>
    <!-- Teeth -->
    <rect x="-16" y="18" width="5" height="10" rx="1" fill="#1a1a1a" opacity="0.9"/>
    <rect x="-8" y="19" width="5" height="11" rx="1" fill="#1a1a1a" opacity="0.9"/>
    <rect x="0" y="19" width="5" height="11" rx="1" fill="#1a1a1a" opacity="0.9"/>
    <rect x="8" y="18" width="5" height="10" rx="1" fill="#1a1a1a" opacity="0.9"/>
    <rect x="-18" y="16" width="36" height="2" rx="1" fill="#6a7a8a" opacity="0.5"/>
  </g>
  <!-- Bottom ring -->
  <ellipse cx="256" cy="425" rx="108" ry="20" fill="none" stroke="url(#diamond)" stroke-width="4" opacity="0.9"/>
  <ellipse cx="256" cy="425" rx="108" ry="20" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
</svg>
